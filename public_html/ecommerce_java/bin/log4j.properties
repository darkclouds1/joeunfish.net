# default logger
log4j.rootLogger=INFO, console, logfile
#log4j.additivity.rootLogger=false

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Threshold=INFO,WARN
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%5p [%d{HH:mm:ss}] - %m%n

log4j.appender.logfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.logfile.DatePattern='.'yyyy-MM-dd
log4j.appender.logfile.File=./log/dailyLog.log
log4j.appender.logfile.Threshold=INFO,WARN
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%5p [%d{HH:mm:ss}] - %m%n

########################################
log4j.rootLogger=console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Threshold=OFF