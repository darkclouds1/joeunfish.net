; SD(자료 송신),  RD(자료 수신), RS(송신List 수신) , RR (수신 List 수신)
; 정의된 순서대로 실행. 기본값, SD,  RD
common.jobtype = SD

;;;;;;;;;;;;;;;;;;;;;;;;;;;수신옵션
; 문서타입 (ORDERS, INVOIC, ...). 기본값, ORDERS
;common.datatype = ASN
; E(미수신) R(기수신) A(미수신 + 기수신). 기본값, E
common.flag = R
; YYYYMMDDhhmm 기본값, 미수신이면 199901010000, 기수신이면 하루전
;common.starttime = 200710101251
; YYYYMMDDhhmm 기본값, 현재 시간
;common.endtime = 200710101252
; 상대편 업체. 아이디 기본값, ALL
common.remoteid = upanm04
; 수신 파일 Append 여부. 
; Y 하나의 파일로 저장. N 엎어쓰기. S 파일명_YYYYMMDDhhmmss 로 저장. D 파일명_YYYYMMDD 로 저장하고 같은 이름이면 엎어씀. 기본값, Y
common.recvfileappend = S
; 수신 파일명. 있으면 해당 rule 에 따라 됨. 없으면 서버에서 지정한 이름.
common.recvfilename = DAS_

;;;;;;;;;;;;;;;;;;;;;;;;;;;송신옵션
; 송신된 파일 삭제 여부.  N 이면 발송 후 _end 로 변경, Y 이면 삭제. 기본값, Y 
common.deletesendedfile = N