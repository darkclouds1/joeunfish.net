;;;;;;;;;;;;;;;;;;;;;;;;;;;폴더옵션
; 송신파일 폴더명. 기본값, $ECOMMERCE/send
common.sendfolder = d:/ecommerce_java/send
; 수신파일 폴더명. 기본값, $ECOMMERCE/recv
